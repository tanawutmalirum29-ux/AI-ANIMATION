name: Story Studio animated map QA
on:
  push:
    branches:
      - main
      - feature/character-interaction-scene-switch
      - feature/cinematic-fx-v1
    paths:
      - index.html
      - animated-map.js
      - animated-map.css
      - cinematic-fx.js
      - cinematic-fx.css
      - character-interaction.js
      - character-interaction.css
      - narration-director.js
      - studio-sound-assistant.js
      - site-auth.js
      - runtime-config.js
      - studio-ai-core.js
      - studio-github-art.js
      - studio-timing-auditor.js
      - studio-ai-workspace.js
      - studio-ai-model-worker.js
      - studio-ai-cpu-worker.js
      - tests/ai-workspace-regression.test.cjs
      - studio-ai-workspace.css
      - studio-asset-core.js
      - studio-art-vault.js
      - studio-art-vault.css
      - assets/library.json
      - autodub/github_assets.py
      - autodub/enable-github.sh
      - tests/art-vault-github-bridge.cjs
      - tests/art-vault-pr-qa.cjs
      - .github/scripts/validate-art-pr.mjs
      - tests/art-vault-core-smoke.cjs
      - tests/art-vault-backend-smoke.py
      - tests/art-vault-browser-smoke.cjs
      - tests/studio-timing-auditor-smoke.cjs
      - tests/local-ai-core-smoke.cjs
      - tests/studio-sound-assistant-smoke.cjs
      - tests/local-ai-workspace-smoke.cjs
      - autodub/handler.py
      - autodub/deploy.sh
      - amplify.yml
      - tests/animated-map-smoke.cjs
      - tests/cinematic-fx-smoke.cjs
      - tests/character-interaction-smoke.cjs
      - tests/mobile-scroll-smoke.cjs
      - tests/auto-dub-smoke.cjs
      - tests/site-auth-smoke.cjs
      - tests/site-auth-handler-smoke.py
      - tests/voice-preview-smoke.cjs
      - .github/workflows/animated-map-qa.yml
  pull_request:
    paths:
      - index.html
      - narration-director.js
      - studio-sound-assistant.js
      - site-auth.js
      - runtime-config.js
      - studio-ai-core.js
      - studio-github-art.js
      - studio-timing-auditor.js
      - studio-ai-workspace.js
      - studio-ai-model-worker.js
      - studio-ai-cpu-worker.js
      - tests/ai-workspace-regression.test.cjs
      - studio-ai-workspace.css
      - studio-asset-core.js
      - studio-art-vault.js
      - studio-art-vault.css
      - assets/library.json
      - autodub/github_assets.py
      - autodub/enable-github.sh
      - tests/art-vault-github-bridge.cjs
      - tests/art-vault-pr-qa.cjs
      - .github/scripts/validate-art-pr.mjs
      - tests/art-vault-core-smoke.cjs
      - tests/art-vault-backend-smoke.py
      - tests/art-vault-browser-smoke.cjs
      - tests/studio-timing-auditor-smoke.cjs
      - tests/local-ai-core-smoke.cjs
      - tests/local-ai-workspace-smoke.cjs
      - autodub/handler.py
      - autodub/deploy.sh
      - amplify.yml
      - tests/site-auth-handler-smoke.py
      - tests/site-auth-smoke.cjs
      - tests/auto-dub-smoke.cjs
      - tests/narration-director-smoke.cjs
      - tests/mobile-scroll-smoke.cjs
      - .github/workflows/animated-map-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout files
        uses: actions/checkout@v4
      - name: Set Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check static JavaScript
        run: |
          node --check animated-map.js
          node --check cinematic-fx.js
          node --check character-interaction.js
          node --check narration-director.js
          node --check studio-sound-assistant.js
          node --check site-auth.js
          node --check runtime-config.js
          node --check studio-github-art.js
          node --check studio-ai-core.js
          node --check studio-timing-auditor.js
          node --check studio-ai-workspace.js
          node --check studio-ai-model-worker.js
          node --check studio-ai-cpu-worker.js
          node --test tests/ai-workspace-regression.test.cjs
          node --check studio-asset-core.js
          node --check studio-art-vault.js
          node tests/art-vault-core-smoke.cjs
          node tests/art-vault-github-bridge.cjs
          node tests/art-vault-pr-qa.cjs
          python3 -m py_compile autodub/github_assets.py
          python3 tests/art-vault-backend-smoke.py
          bash -n autodub/enable-github.sh
          node tests/local-ai-core-smoke.cjs
          node tests/studio-timing-auditor-smoke.cjs
          node tests/studio-sound-assistant-smoke.cjs
          python3 -m py_compile autodub/handler.py
          python3 tests/site-auth-handler-smoke.py
          bash -n autodub/deploy.sh
          node --check tests/narration-director-smoke.cjs
          node tests/narration-director-smoke.cjs
          node --check tests/animated-map-smoke.cjs
          node --check tests/cinematic-fx-smoke.cjs
          node --check tests/character-interaction-smoke.cjs
          node --check tests/mobile-scroll-smoke.cjs
          node --check tests/auto-dub-smoke.cjs
          node --check tests/voice-preview-smoke.cjs
          test -f index.html && test -f animated-map.css
          mkdir -p dist/assets
          cp index.html animated-map.js animated-map.css cinematic-fx.js cinematic-fx.css character-interaction.js character-interaction.css narration-director.js studio-sound-assistant.js site-auth.js runtime-config.js studio-ai-core.js studio-timing-auditor.js studio-ai-workspace.js studio-ai-model-worker.js studio-ai-cpu-worker.js studio-ai-workspace.css studio-asset-core.js studio-github-art.js studio-art-vault.js studio-art-vault.css dist/
          cp assets/library.json dist/assets/library.json
          test -f dist/animated-map.js && test -f dist/animated-map.css
          test -f dist/cinematic-fx.js && test -f dist/cinematic-fx.css
          test -f dist/character-interaction.js && test -f dist/character-interaction.css
          test -f dist/narration-director.js
          test -f dist/studio-sound-assistant.js
          test -f dist/site-auth.js && test -f dist/runtime-config.js
          test -f dist/studio-timing-auditor.js
          test -f dist/studio-ai-core.js && test -f dist/studio-ai-workspace.js && test -f dist/studio-ai-workspace.css
          test -f dist/studio-ai-model-worker.js && test -f dist/studio-ai-cpu-worker.js
          test -f dist/studio-github-art.js
          test -f dist/studio-asset-core.js && test -f dist/studio-art-vault.js && test -f dist/studio-art-vault.css && test -f dist/assets/library.json
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Run browser smoke
        run: |
          node tests/animated-map-smoke.cjs
          node tests/cinematic-fx-smoke.cjs
          node tests/character-interaction-smoke.cjs
          node tests/mobile-scroll-smoke.cjs
          node tests/auto-dub-smoke.cjs
          node tests/site-auth-smoke.cjs
          node tests/local-ai-workspace-smoke.cjs
          node tests/art-vault-browser-smoke.cjs
          node tests/voice-preview-smoke.cjs
