name: Deploy AWS Studio automatically

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-animation-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch main
        uses: actions/checkout@v4

      - name: Verify one-time AWS connection
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        shell: bash
        run: |
          if [[ ! "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/story-studio-gha-deploy$ ]]; then
            echo "::error::GitHub Actions ยังไม่ผูก AWS role. Run autodub/setup-github-deploy.sh in AWS CloudShell once and set AWS_DEPLOY_ROLE_ARN in repository Actions variables."
            exit 1
          fi

      - name: Verify GitHub immutable OIDC claims (no tokens logged)
        shell: bash
        env:
          EXPECTED_SUB: repo:tanawutmalirum29-ux@225819900/AI-ANIMATION@1440864911:ref:refs/heads/main
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.parse,urllib.request
          url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          parts=urllib.parse.urlsplit(url)
          query=dict(urllib.parse.parse_qsl(parts.query))
          query["audience"]="sts.amazonaws.com"
          request_url=urllib.parse.urlunsplit((parts.scheme,parts.netloc,parts.path,
                        urllib.parse.urlencode(query),parts.fragment))
          req=urllib.request.Request(request_url,headers={
              "Authorization":"bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(req,timeout=20) as resp:
              encoded=json.load(resp)["value"]
          body=encoded.split(".")[1]
          claims=json.loads(base64.urlsafe_b64decode(body+"="*(-len(body)%4)))
          actual=claims.get("sub","")
          print("GitHub OIDC issuer:",claims.get("iss",""))
          print("GitHub OIDC audience:",claims.get("aud",""))
          print("GitHub OIDC subject:",actual)
          # The sensitive signed token and signature are deliberately never printed.
          assert claims.get("iss")=="https://token.actions.githubusercontent.com","Wrong OIDC issuer"
          assert claims.get("aud")=="sts.amazonaws.com","Wrong OIDC audience"
          if actual!=os.environ["EXPECTED_SUB"]:
              raise SystemExit("OIDC subject differs from the main-only IAM role trust. "+
                               "Re-check GitHub OIDC repository owner/repo IDs and IAM trust.")
          print("OIDC immutable subject matches IAM bootstrap configuration")
          PY

      - name: Authorize short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          role-session-name: StoryStudioDeploy

      - name: Package existing Lambda function (no API keys in build)
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/story-studio-lambda"
          mkdir -p "$BUILD"
          python3 -m pip install --quiet --upgrade \
            --target "$BUILD" --platform manylinux2014_x86_64 \
            --python-version 3.12 --implementation cp --only-binary=:all: edge-tts
          cp autodub/handler.py autodub/github_assets.py autodub/teacher.py \
             autodub/cloud_jobs.py autodub/student_learning.py autodub/story_auto_train.py \
             autodub/github_oauth.py autodub/member_ai.py "$BUILD/"
          python3 - "$BUILD" "$RUNNER_TEMP/story-studio-autodub.zip" <<'PY'
          import os,sys,zipfile
          src,dst=sys.argv[1:]
          with zipfile.ZipFile(dst,"w",zipfile.ZIP_DEFLATED) as z:
              for root,dirs,files in os.walk(src):
                  for f in files:
                      p=os.path.join(root,f)
                      z.write(p,os.path.relpath(p,src))
          PY

      - name: Update Lambda CODE only (preserve environment and saved API keys)
        shell: bash
        run: |
          set -euo pipefail
          aws lambda get-function --function-name story-studio-autodub \
            --region ap-southeast-2 >/dev/null
          aws lambda update-function-code \
            --function-name story-studio-autodub \
            --region ap-southeast-2 \
            --zip-file "fileb://$RUNNER_TEMP/story-studio-autodub.zip" >/dev/null
          aws lambda wait function-updated \
            --function-name story-studio-autodub --region ap-southeast-2
          STATUS="$(aws lambda get-function-configuration \
            --function-name story-studio-autodub --region ap-southeast-2 \
            --query 'LastUpdateStatus' --output text)"
          test "$STATUS" = "Successful"
          echo "Lambda updated; SSM SecureString API keys and environment untouched."

      - name: Amplify main (trigger only if automatic builds are disabled)
        shell: bash
        run: |
          set -euo pipefail
          AUTOBUILD="$(aws amplify get-branch \
            --app-id d1wc6w01kiwpnk --branch-name main \
            --region ap-southeast-2 --query 'branch.enableAutoBuild' \
            --output text)"
          if [ "$AUTOBUILD" = "True" ]; then
            echo "Amplify Git-connected branch auto-builds on push to main."
          elif [ "$AUTOBUILD" = "False" ]; then
            aws amplify start-job \
              --app-id d1wc6w01kiwpnk --branch-name main \
              --job-type RELEASE --region ap-southeast-2 >/dev/null
            echo "Amplify main release initiated."
          else
            echo "::error::Cannot determine Amplify auto-build status: $AUTOBUILD"
            exit 1
          fi
