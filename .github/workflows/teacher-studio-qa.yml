name: AI Teacher Studio QA
on:
  push:
    branches: [main]
    paths:
      - 'studio-teacher.js'
      - 'studio-teacher.css'
      - 'studio-ai-workspace.js'
      - 'autodub/teacher.py'
      - 'autodub/student_learning.py'
      - 'studio-student-learning.js'
      - 'studio-story-coach.js'
      - 'studio-story-foundation.js'
      - 'studio-auto-teach.js'
      - 'tests/teacher-auto-teach.test.cjs'
      - 'tests/test_teacher_auto_teach.py'
      - 'training-lab/datasets/thai-narrative-editor-foundation-v1.json'
      - 'training-lab/train-story-foundation.cjs'
      - 'tests/story-foundation-cpu.test.cjs'
      - 'studio-story-coach-ui.js'
      - 'tests/story-continuity-coach.test.cjs'
      - 'tests/test_story_continuity.py'
      - 'studio-script-ml.js'
      - 'tests/test_student_learning.py'
      - 'tests/student-learning.test.cjs'
      - 'tests/student-memory-browser.test.cjs'
      - 'tests/test_student_memory_browser.py'
      - 'autodub/handler.py'
      - 'autodub/setup-teacher.sh'
      - 'tests/test_teacher_backend.py'
      - 'tests/teacher-studio-contract.test.cjs'
  pull_request:
    paths:
      - 'studio-teacher.js'
      - 'studio-teacher.css'
      - 'studio-ai-workspace.js'
      - 'autodub/teacher.py'
      - 'autodub/student_learning.py'
      - 'studio-student-learning.js'
      - 'studio-story-coach.js'
      - 'studio-story-foundation.js'
      - 'studio-auto-teach.js'
      - 'tests/teacher-auto-teach.test.cjs'
      - 'tests/test_teacher_auto_teach.py'
      - 'training-lab/datasets/thai-narrative-editor-foundation-v1.json'
      - 'training-lab/train-story-foundation.cjs'
      - 'tests/story-foundation-cpu.test.cjs'
      - 'studio-story-coach-ui.js'
      - 'tests/story-continuity-coach.test.cjs'
      - 'tests/test_story_continuity.py'
      - 'studio-script-ml.js'
      - 'tests/test_student_learning.py'
      - 'tests/student-learning.test.cjs'
      - 'tests/student-memory-browser.test.cjs'
      - 'tests/test_student_memory_browser.py'
      - 'autodub/handler.py'
      - 'autodub/setup-teacher.sh'
      - 'tests/test_teacher_backend.py'
      - 'tests/teacher-studio-contract.test.cjs'
permissions:
  contents: read
jobs:
  teacher-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and Python
        run: |
          node --check studio-teacher.js
          node --check studio-ai-workspace.js
          node --check studio-student-learning.js
          node --check studio-story-coach.js
          node --check studio-story-foundation.js
          node --check studio-story-coach-ui.js
          node --check studio-auto-teach.js
          node --check studio-script-ml.js
          python3 -m py_compile autodub/teacher.py autodub/handler.py autodub/student_learning.py
          node --test tests/teacher-studio-contract.test.cjs tests/student-learning.test.cjs tests/student-memory-browser.test.cjs tests/story-continuity-coach.test.cjs tests/story-foundation-cpu.test.cjs
          node training-lab/train-story-foundation.cjs
          python3 tests/test_teacher_backend.py
          python3 tests/test_student_learning.py
          python3 tests/test_student_memory_browser.py
          python3 tests/test_story_continuity.py
          python3 tests/test_teacher_auto_teach.py
