      - 'tests/teacher-model-probe.test.cjs'
      - 'tests/test_teacher_model_probe.py'
      - 'tests/test_teacher_connections.py'
      - 'tests/aws-auto-deploy-contract.test.cjs'
      - 'autodub/setup-github-deploy.sh'
      - '.github/workflows/deploy-aws-studio.yml'
      - 'autodub/story_auto_train.py'
      - 'tests/test_story_auto_train.py'
      - 'tests/teacher-self-healing.test.cjs'
      - 'tests/test_teacher_history.py'
      - 'tests/teacher-history-ui.test.cjs'
      - 'tests/test_teacher_auto_teach.py'
      - 'training-lab/datasets/thai-narrative-editor-foundation-v1.json'
      - 'training-lab/train-story-foundation.cjs'
      - 'tests/story-foundation-cpu.test.cjs'
