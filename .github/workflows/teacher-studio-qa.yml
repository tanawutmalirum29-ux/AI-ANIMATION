permissions:
  contents: read
jobs:
  teacher-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and Python
        run: |
          python3 -m pip install --quiet cryptography boto3
          node --check site-auth.js
          node --check member-portal.js
          python3 -m py_compile autodub/github_oauth.py autodub/guest_access.py autodub/member_ai.py autodub/member_keys.py autodub/owner_inspection.py autodub/handler.py
          bash -n autodub/setup-github-oauth.sh
          node --check studio-teacher.js
          node --check studio-mother-chat.js
          node --check studio-ai-workspace.js
          node --check studio-student-learning.js
          node --check studio-story-coach.js
          node --check studio-story-foundation.js
          node --check studio-story-coach-ui.js
          node --check studio-auto-teach.js
          node --check studio-thai-editor.js
          node --check studio-cloud-teach.js
          node --check studio-multi-json.js
          python3 -m py_compile autodub/thai_editor.py autodub/story_auto_train.py autodub/teacher.py autodub/teacher_connections.py autodub/owner_key_vault.py autodub/teacher_advisor.py autodub/cloud_jobs.py autodub/cloud_upload.py autodub/student_learning.py
          node --check studio-story-only.js
          node --check studio-story-only-ui.js
          node --check studio-script-ml.js
          python3 -m py_compile autodub/teacher.py autodub/handler.py autodub/student_learning.py
          bash -n autodub/setup-github-deploy.sh
          node --test tests/member-studio-access.test.cjs tests/member-cpu-only-ui.test.cjs tests/thai-editor-ui.test.cjs tests/member-v1-ui.test.cjs tests/multi-json-queue-ui.test.cjs tests/mother-chat-ui.test.cjs tests/cloud-jobs-ui.test.cjs tests/github-oauth-members.test.cjs tests/teacher-history-ui.test.cjs tests/aws-auto-deploy-contract.test.cjs tests/teacher-self-healing.test.cjs tests/teacher-studio-contract.test.cjs tests/student-learning.test.cjs tests/student-memory-browser.test.cjs tests/story-continuity-coach.test.cjs tests/story-foundation-cpu.test.cjs tests/teacher-auto-teach.test.cjs tests/teacher-auto-teach-failfast.test.cjs tests/story-only-json.test.cjs tests/teacher-model-probe.test.cjs
          node training-lab/train-story-foundation.cjs
          python3 tests/test_teacher_advisor.py
          python3 tests/test_teacher_backend.py
          python3 tests/test_student_learning.py
          python3 tests/test_student_memory_browser.py
          python3 tests/test_story_continuity.py
          python3 tests/test_cloud_upload.py
          python3 tests/test_teacher_memory_fastpath.py
          python3 tests/test_cloud_memory_permissions.py
          python3 tests/test_multi_json_queue.py
          python3 tests/test_teacher_timeout_recovery.py
          python3 tests/test_cloud_jobs.py
          python3 tests/test_teacher_auto_teach.py
          python3 tests/test_teacher_model_probe.py
          python3 tests/test_teacher_connections.py
          python3 tests/test_teacher_multi_connections.py
          python3 tests/test_owner_key_vault.py
          python3 autodub/thai_editor.py
          python3 tests/test_thai_editor.py
          python3 tests/test_story_auto_train.py
          python3 tests/test_teacher_history.py
          python3 tests/test_member_cpu_guest.py
          python3 tests/test_member_editor_access.py
          python3 tests/test_owner_inspection.py
          python3 tests/test_github_oauth_roles.py
          python3 tests/test_member_key_vault.py
