      - 'studio-teacher.js'
      - 'studio-teacher.css'
      - 'studio-ai-workspace.js'
      - 'autodub/teacher.py'
      - 'autodub/student_learning.py'
      - 'studio-student-learning.js'
      - 'studio-story-coach.js'
      - 'studio-story-foundation.js'
