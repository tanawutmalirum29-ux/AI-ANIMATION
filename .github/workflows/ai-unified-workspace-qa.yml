name: Unified AI Workspace QA
on:
  push:
    branches: [fix/unified-ai-production-workspace, main]
    paths:
      - 'studio-ai-mode.js'
      - 'studio-ai-mode.css'
      - 'studio-ai-workspace.js'
      - 'studio-ai-workspace.css'
      - 'tests/ai-only-mode-smoke.cjs'
      - '.github/workflows/ai-unified-workspace-qa.yml'
  pull_request:
    paths:
      - 'studio-ai-mode.js'
      - 'studio-ai-mode.css'
      - 'studio-ai-workspace.js'
      - 'studio-ai-workspace.css'
      - 'tests/ai-only-mode-smoke.cjs'
      - '.github/workflows/ai-unified-workspace-qa.yml'
permissions:
  contents: read
jobs:
  unified-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript and the AI workspace contract
        run: |
          node --check studio-ai-mode.js
          node --check studio-ai-workspace.js
          node --test tests/ai-workspace-regression.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Browser smoke - desktop and mobile
        run: node tests/ai-only-mode-smoke.cjs
