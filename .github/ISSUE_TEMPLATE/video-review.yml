name: "ส่งวิดีโอให้ตรวจ (เลือกไฟล์)"
description: "ส่งคลิปจาก iPad หรือโทรศัพท์ให้ตรวจง่าย ๆ"
title: "ส่งวิดีโอให้ตรวจ"
body:
  - type: markdown
    attributes:
      value: |
        ### ส่งคลิปจาก iPad
        1. กด **เลือกไฟล์ / Browse files** ที่ช่องด้านล่าง
        2. เลือกวิดีโอจาก **คลังรูปภาพ** หรือ **ไฟล์** ของเครื่อง (ตามตัวเลือกที่ Safari แสดง)
        3. รอให้ไฟล์แนบเสร็จ แล้วกด **Submit new issue** ด้านล่าง
        4. คัดลอกลิงก์ Issue ที่เปิดขึ้นมา ส่งลิงก์นั้นในแชตเพื่อให้ตรวจคลิปได้

        รองรับ .mp4, .mov, .webm; ขนาดไฟล์อาจถูกจำกัดตามประเภทบัญชี GitHub (แผนฟรีทั่วไป 10 MB ต่อวิดีโอ)
        **ระวัง:** Repository เป็นสาธารณะ คลิปที่แนบจะเปิดดูได้โดยคนทั่วไป อย่าแนบข้อมูลลับ
        ถ้าไฟล์ใหญ่หรือแนบไม่สำเร็จ ให้วางลิงก์ที่เปิดดูได้ในช่องสำรอง
  - type: upload
    id: video-file
    attributes:
      label: "1. เลือกไฟล์วิดีโอจากเครื่อง"
      description: "แตะเพื่อเลือกไฟล์ MP4, MOV หรือ WEBM (ไม่ต้องเขียนโค้ด)"
    validations:
      required: false
      accept: ".mp4,.mov,.webm"
  - type: input
    id: video-link
    attributes:
      label: "2. ลิงก์วิดีโอ (สำรอง ถ้าแนบไฟล์ไม่ได้)"
      placeholder: "https://..."
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: "3. อยากให้ตรวจอะไร (ไม่จำเป็นต้องกรอก)"
      placeholder: "เช่น เสียงพากย์ไม่ได้ / วิดีโอกระตุก / อยากให้ดูทั้งคลิป"
    validations:
      required: false
