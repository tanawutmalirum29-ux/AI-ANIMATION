name: "ส่งวิดีโอหลายคลิปให้ตรวจ"
description: "แนบคลิปจาก iPad ได้หลายคลิปใน Issue เดียว"
title: "ส่งวิดีโอให้ตรวจ"
body:
  - type: markdown
    attributes:
      value: |
        ### ส่งคลิปหลายคลิปในครั้งเดียวจาก iPad
        1. แตะ **Browse files / เลือกไฟล์** ในช่องคลิปที่ 1 แล้วเลือกวิดีโอจาก **รูปภาพ** หรือ **ไฟล์**
        2. ถ้ามีคลิปเพิ่ม ให้เลือกที่ช่องคลิปที่ 2, 3 หรือ 4 ได้เลย (ใช้เฉพาะช่องที่ต้องการ)
        3. รอแต่ละคลิปอัปโหลดเสร็จ จากนั้นกด **Submit new issue** เพียงครั้งเดียว
        4. จะส่งคลิปเพิ่มภายหลัง ให้เปิด Issue เดิม แล้วแนบไฟล์ในช่อง **Comment** ได้โดยไม่ต้องสร้าง Issue ใหม่
        5. คัดลอกลิงก์ Issue มาส่งในแชต เพื่อให้เปิดตรวจทุกคลิปในที่เดียว

        ไฟล์วิดีโอรองรับ .mp4, .mov, .webm
        ข้อจำกัดไฟล์แนบ GitHub: บัญชีแผนฟรี 10 MB ต่อคลิป และบางแผนเสียเงินสูงสุด 100 MB ต่อคลิป
        **คลิปบน Repository สาธารณะเปิดดูได้โดยคนทั่วไป** อย่าแนบข้อมูลส่วนตัวหรือความลับ
        หากคลิปใหญ่กว่าข้อจำกัด ให้ใช้ช่องลิงก์วิดีโอด้านล่างแทน
  - type: upload
    id: video-1
    attributes:
      label: "คลิปที่ 1"
      description: "แตะเลือกวิดีโอ MP4, MOV หรือ WEBM"
    validations:
      required: false
      accept: ".mp4,.mov,.webm"
  - type: upload
    id: video-2
    attributes:
      label: "คลิปที่ 2 (ถ้ามี)"
      description: "เลือกคลิปที่สองโดยไม่ต้องเปิด Issue ใหม่"
    validations:
      required: false
      accept: ".mp4,.mov,.webm"
  - type: upload
    id: video-3
    attributes:
      label: "คลิปที่ 3 (ถ้ามี)"
    validations:
      required: false
      accept: ".mp4,.mov,.webm"
  - type: upload
    id: video-4
    attributes:
      label: "คลิปที่ 4 (ถ้ามี)"
    validations:
      required: false
      accept: ".mp4,.mov,.webm"
  - type: textarea
    id: video-links
    attributes:
      label: "ลิงก์คลิปเพิ่มเติม (ถ้ามี)"
      description: "ใส่ได้หลายลิงก์ แยกบรรทัด สำหรับคลิปที่ใหญ่เกินข้อจำกัด"
      placeholder: "https://..."
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: "อยากให้ตรวจอะไร (ไม่จำเป็นต้องกรอก)"
      placeholder: "เช่น คลิปที่ 2 เสียงพากย์เบา / คลิปที่ 3 ภาพกระตุก"
    validations:
      required: false
