version: 1
frontend:
  phases:
    build:
      commands:
        - mkdir -p dist
        - cp index.html animated-map.js animated-map.css cinematic-fx.js cinematic-fx.css character-interaction.js character-interaction.css narration-director.js site-auth.js runtime-config.js dist/
        - node -e "require('fs').writeFileSync('dist/runtime-config.js','window.STORY_STUDIO_CONFIG='+JSON.stringify({apiUrl:process.env.STORY_STUDIO_API_URL||''})+';')"
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []
